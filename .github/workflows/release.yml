name: Release Epoxy

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cat > /tmp/release-notes.md <<-EOM
          **Epoxy v${VERSION}** — Free-tier LLM proxy for Hermes Agent

          ## Changes
          $(PREV=$(git tag --sort=-creatordate | head -2 | tail -1); if [ -n "$PREV" ]; then git log --oneline "$PREV"...HEAD; else git log --oneline --max-count=20; fi)

          ## Quick Start
          \`\`\`bash
          # Docker
          docker pull ghcr.io/instax-dutta/epoxy:${VERSION}
          docker run -d --name epoxy -p 8080:8080 --env-file .env ghcr.io/instax-dutta/epoxy:${VERSION}

          # Manual (download the zip)
          # 1. Extract epoxy-${VERSION}.zip
          # 2. cp .env.example .env and add your keys
          # 3. pip install -r requirements.txt
          # 4. python server.py
          \`\`\`

          Import \`egg-epoxy.json\` into your Pterodactyl panel to deploy there.

          ## Assets
          - \`epoxy-${VERSION}.zip\` — ready-to-run source package
          - Docker image: \`ghcr.io/instax-dutta/epoxy:${VERSION}\`
          EOM

      - name: Build source archive
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p /tmp/epoxy-$VERSION
          cp -r \
            server.py \
            requirements.txt \
            Dockerfile \
            entrypoint.sh \
            .env.example \
            egg-epoxy.json \
            README.md \
            /tmp/epoxy-$VERSION/
          cd /tmp
          zip -r epoxy-$VERSION.zip epoxy-$VERSION/
          echo "archive=/tmp/epoxy-$VERSION.zip" >> "$GITHUB_ENV"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Epoxy ${{ github.ref_name }}
          body_path: /tmp/release-notes.md
          files: ${{ env.archive }}
          generate_release_notes: false
          make_latest: true
